# Joint state publisher - broadcasts all joint positions to /joint_states
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# Individual position controllers for each joint
# Tune PID gains if joints oscillate or are too sluggish
joint0_position_controller:
  type: position_controllers/JointPositionController
  joint: joint0

joint1_position_controller:
  type: position_controllers/JointPositionController
  joint: joint1

joint2_position_controller:
  type: position_controllers/JointPositionController
  joint: joint2


joint3_position_controller:
  type: position_controllers/JointPositionController
  joint: joint3


joint4_position_controller:
  type: position_controllers/JointPositionController
  joint: joint4


end_effector_joint_position_controller:
  type: position_controllers/JointPositionController
  joint: end_effector_joint

# Required by gazebo_ros_control for PositionJointInterface
gazebo_ros_control:
  pid_gains:
    joint0:             {p: 100.0, i: 0.01,  d: 10.0}
    joint1:             {p: 100.0, i: 0.01,  d: 10.0}
    joint2:             {p: 100.0, i: 0.01,  d: 10.0}
    joint3:             {p: 50.0,  i: 0.01,  d: 5.0}
    joint4:             {p: 50.0,  i: 0.01,  d: 5.0}
    end_effector_joint: {p: 50.0,  i: 0.01,   d: 5.0}