name: Docker Build Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest #Type of runner that the job will run on

    # Sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository # This ensures job can access repo
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx # Needed for building docker in CI/CD
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Use the repository root as the build context
          file: ./Dockerfile
          target: ci # only build the CI stage in the dockerfile
          tags: uvic-rover-build-test:latest
          push: false
          load: false
          # think about disabling this if it is taking up too much space
          cache-from: type=gha # Enable GitHub Actions cache for Docker layers
          cache-to: type=gha, mode=max # Save cache for future runs

  test:
    runs-on: ubuntu-latest
    needs: build # Test only runs when build succeeds
    if: false # This job is disabled right now

    steps:
      - name: Placeholder
        run: echo "tests disabled for now."